name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml declares requires-python = ">=3.11"; test the floor
        # too, not just the version this repo happens to have been written
        # against (3.12-only syntax has slipped in and passed CI before).
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,ui,circl]"
      - name: Run tests
        run: pytest -q
