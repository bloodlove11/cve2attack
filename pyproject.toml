[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cve-attack-eval-agent"
version = "0.1.0"
description = "CVE-to-ATT&CK Eval Agent — measured Live LLM pipeline (CIRCL/CTID gold, Eval Lab, LLM-only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mounir Ait alla" }]
dependencies = [
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.28.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
circl = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
]

[project.scripts]
cve-attack-eval-agent = "src.main:main"
sec-tool-agent = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
